# pnpm settings.
#
# NOT a monorepo — there is no `packages:` key and there will not be one.
# pnpm 11 moved several settings out of package.json into this file, which is
# the only reason it exists.

# Dependencies permitted to run install scripts. pnpm blocks all of them by
# default as a supply-chain control, and each entry below is a deliberate
# exception rather than a blanket allow:
#
#   esbuild        - downloads its platform-native binary. Vitest and tsx are
#                    both unusable without it.
#   unrs-resolver  - native module resolver used by the ESLint import plugin.
#
# Adding to this list means granting arbitrary code execution at install time.
# Do not add an entry without a specific reason recorded here.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Dependencies whose install scripts are explicitly DECLINED.
#
# pnpm blocks these by default, but an un-acknowledged block makes every
# `pnpm <script>` invocation fail its dependency-status check with
# ERR_PNPM_IGNORED_BUILDS — which takes out typecheck, lint, test and build.
# Listing them here records the decision instead of silencing a warning.
#
# All three arrive transitively under @testcontainers/postgresql (integration
# tests only — they never reach the application bundle):
#
#   cpu-features - OPTIONAL native probe for ssh2. ssh2 runs pure-JS without it.
#   ssh2         - ships prebuilt bindings; its script only compiles the
#                  optional cpu-features accelerator above.
#   protobufjs   - its postinstall merely regenerates a bundled .d.ts.
#
# Verified by actually starting a Testcontainers Postgres and running the
# integration suite against it — see tests/integration/.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2
