# ─────────────────────────────────────────────────────────────────────────────
# Local development database — LOCAL DEVELOPMENT / TESTING ONLY.
#
#   docker compose -f compose.dev.yml up -d postgres
#   pnpm db:migrate     <- plain host script, identical to what CI and
#                          production both already run; no image to build
#   pnpm dev            <- the app itself runs on the host for fast HMR
#
# Production is Netlify + Supabase — no Docker at all (see docs/DEPLOYMENT.md).
# Integration tests don't use this file either — they start their own
# throwaway Postgres via Testcontainers (tests/integration/global-setup.ts).
# This one `postgres` service, for browsing the app locally, is the entire
# remaining Docker Compose surface in the repo.
# ─────────────────────────────────────────────────────────────────────────────

name: burmy-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: burmy
      POSTGRES_PASSWORD: burmy
      POSTGRES_DB: burmy
      # Deterministic initdb args so a rebuilt volume always matches.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Published in DEVELOPMENT ONLY so `pnpm dev` on the host can connect.
      # Production never publishes this port — Postgres sits on an
      # `internal: true` network with no route to or from the internet.
      - '127.0.0.1:5432:5432'
    volumes:
      # ── PostgreSQL 18 VOLUME PATH ──────────────────────────────────────────
      # PG18 moved PGDATA to /var/lib/postgresql/18/docker and the declared
      # VOLUME to /var/lib/postgresql.
      #
      # The pre-18 convention `/var/lib/postgresql/data` FAILS SILENTLY: the
      # container starts, the healthcheck passes, and the data disappears on
      # the next recreate. Do not "fix" this back.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U burmy -d burmy']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [burmy_dev]

networks:
  burmy_dev:
    driver: bridge

volumes:
  pgdata:
