# ─────────────────────────────────────────────────────────────────────────────
# Production stack. See compose.dev.yml for local development — this file is
# never used by `pnpm dev`.
#
#   docker compose up -d postgres            <- scripts/deploy.sh does this first
#   docker compose run --rm migrate
#   docker compose up -d web cloudflared
#
# Two networks, not optional (docs/DEPLOYMENT.md):
#   edge   — outbound internet, for cloudflared + web
#   dbnet  — internal: true, no route in or out, for web + migrate + postgres
#
# NO PORTS ARE PUBLISHED ANYWHERE IN THIS FILE. cloudflared is the only path
# in, over an outbound-only tunnel. Postgres has no route to the internet at
# all, even from inside the VPS's other network interfaces.
#
# Secrets are scoped by CONSUMER, not one blanket .env (owner decision, M10):
# postgres/database/app/tunnel/backup are five separate 0600 files, each
# named `.env.<scope>`, gitignored, populated from `.env.<scope>.example`.
# `web` never sees B2/restic/tunnel credentials it has no use for; backup
# secrets never enter any container at all — scripts/backup.sh reads
# `.env.backup` directly, on the host, over `docker compose exec`.
#
# Images are NOT built by `docker compose build` in normal operation —
# scripts/deploy.sh builds and tags them explicitly with immutable git-SHA
# tags plus floating `current`/`previous` aliases (see docs/DEPLOYMENT.md,
# "Image versioning"), then runs `docker compose up -d --no-build`. The
# `build:` blocks below exist for local testing convenience only
# (`docker compose build` / `up --build` against this same file with local
# placeholder secrets).
# ─────────────────────────────────────────────────────────────────────────────

name: burmy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: [.env.postgres]
    volumes:
      # PG18 moved PGDATA to /var/lib/postgresql/18/docker and the declared
      # VOLUME to /var/lib/postgresql — the pre-18 .../data path fails
      # SILENTLY (starts, reports healthy, loses data on recreate). See
      # CLAUDE.md. Do not "fix" this back.
      - pgdata:/var/lib/postgresql
    networks: [dbnet]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U burmy -d burmy']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No `ports:` — unreachable from outside the Docker network, full stop.

  migrate:
    build:
      context: .
      target: migrator
    image: burmy-migrator:current
    # `.env.app` is included alongside `.env.database` ONLY because this
    # image is also how scripts/deploy.sh runs provision-owner.mjs after
    # migrations (both need OWNER_EMAIL as well as DATABASE_URL) — it never
    # receives `.env.tunnel` or `.env.backup`.
    env_file: [.env.database, .env.app]
    networks: [dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot: applies migrations (or, when scripts/deploy.sh overrides the
    # command, provisions the owner row) and exits. Never restarted by
    # Compose itself.
    restart: 'no'

  web:
    build:
      context: .
      target: runner
    image: burmy-web:current
    restart: unless-stopped
    # Docker's built-in tini (via --init) for correct SIGTERM forwarding and
    # zombie reaping — cheaper than baking tini into the image.
    init: true
    # M5 parses uploaded statements IN MEMORY ONLY, never to disk (a
    # documented course-correction from the original plan) — there is no
    # known runtime write path, so a read-only root filesystem is attempted
    # here. `/tmp` stays writable via tmpfs as a safety margin for anything
    # Node/Next itself wants to scratch-write. If real operation turns out to
    # need more than this, drop `read_only` rather than fighting it — see
    # docs/DEPLOYMENT.md, "Docker hardening".
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 15s
    env_file: [.env.database, .env.app]
    networks: [edge, dbnet]
    depends_on:
      postgres:
        condition: service_healthy
    # HEALTHCHECK is inherited from the image (Dockerfile) — not redeclared
    # here, so there is exactly one definition of what "healthy" means.
    # No `ports:` — cloudflared reaches it by service name on `edge`, and
    # nothing else needs a route to it.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file: [.env.tunnel]
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    # No `ports:` — this is the outbound-only tunnel client. It dials OUT to
    # Cloudflare; nothing dials in to it.

networks:
  edge:
    driver: bridge
  dbnet:
    driver: bridge
    internal: true

volumes:
  pgdata:
